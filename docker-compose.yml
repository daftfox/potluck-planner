services:
  postgres:
    image: postgres:16-alpine
    container_name: potluck-planner-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=potluck
      - POSTGRES_PASSWORD=potluck
      - POSTGRES_DB=potluck
    ports:
      - "5432:5432"
    volumes:
      - potluck-data:/var/lib/postgresql/data

volumes:
  potluck-data:
